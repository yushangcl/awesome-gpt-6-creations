<script>
window.addEventListener('error',event=>{document.getElementById('loading').hidden=true;document.getElementById('error').hidden=false;document.getElementById('error-message').textContent='场景加载遇到问题：'+(event.message||'无法初始化 WebGL。请检查网络与图形加速。');});
function loadThree(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=()=>window.THREE?resolve():reject(new Error('Three.js 未初始化'));s.onerror=reject;document.head.appendChild(s);});}
(async()=>{try{await loadThree('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js');}catch{await loadThree('https://unpkg.com/three@0.160.0/build/three.min.js');}
function createShip(THREE) {
  const group = new THREE.Group();
  group.name = 'The Marigold — three-masted square-rigger';
  const palette = {
    hull: new THREE.MeshStandardMaterial({color:0xffffff, roughness:.82}),
    dark: new THREE.MeshStandardMaterial({color:0x241b19, roughness:.79}),
    deck: new THREE.MeshStandardMaterial({color:0xbe8952, roughness:.91}),
    gold: new THREE.MeshStandardMaterial({color:0xc99a42, metalness:.6, roughness:.39}),
    red: new THREE.MeshStandardMaterial({color:0x9e332c, roughness:.9}),
    window: new THREE.MeshStandardMaterial({color:0xffd697, emissive:0xffb355, emissiveIntensity:1.75, roughness:.5}),
    iron: new THREE.MeshStandardMaterial({color:0x252c2a, metalness:.6, roughness:.52})
  };
  const batches = Object.fromEntries(Object.keys(palette).map(k=>[k,[]]));
  const matrix = new THREE.Matrix4(), q = new THREE.Quaternion(), unit = new THREE.Vector3(0,1,0);
  const color = new THREE.Color(), rope = [], sailPosition = [], sailColor = [];
  let piece = 0;
  function box(mat,x,y,z,sx,sy,sz,rx=0,ry=0,rz=0,tint) {
    q.setFromEuler(new THREE.Euler(rx,ry,rz));
    matrix.compose(new THREE.Vector3(x,y,z),q,new THREE.Vector3(sx,sy,sz));
    batches[mat].push({matrix:matrix.clone(),tint});
  }
  function spar(mat,a,b,r) {
    const av=new THREE.Vector3(...a), bv=new THREE.Vector3(...b), d=bv.clone().sub(av);
    q.setFromUnitVectors(unit,d.clone().normalize());
    matrix.compose(av.add(bv).multiplyScalar(.5),q,new THREE.Vector3(r,d.length(),r));
    batches[mat].push({matrix:matrix.clone()});
  }
  function line(a,b) { rope.push(...a,...b); }
  function curve(points) { for(let i=1;i<points.length;i++) line(points[i-1],points[i]); }
  function widthAt(x) {
    const v=(x+.10)/.91;
    return .225*Math.pow(Math.max(0,1-Math.pow(Math.abs(v),2.6)),.66);
  }

  // Stepped transverse timbers make a readable voxel hull without hundreds of unique meshes.
  for(let i=0;i<26;i++) {
    const x=-.815+i*.06, w=widthAt(x);
    for(let j=0;j<5;j++) {
      const y=-.12+j*.052, ww=Math.max(.027,w*(.60+j*.10));
      const tint=new THREE.Color().setHSL(.065+(piece%3)*.006,.45,.20+(piece++%5)*.018);
      box('hull',x,y,0,.061,.053,ww*2,0,0,0,tint);
    }
    box('deck',x,.157,0,.058,.022,w*1.88);
    for(const side of [-1,1]) {
      box('dark',x,.153,side*w,.063,.055,.022);
      box('gold',x,.097,side*w*.99,.063,.012,.017);
      box('gold',x,-.016,side*w*.89,.063,.011,.014);
      if(i>1 && i<23 && i%3===0) {
        box('iron',x,.065,side*(w+.005),.044,.035,.018);
        box('gold',x,.087,side*(w+.014),.047,.007,.012);
        box('dark',x,.07,side*(w+.025),.021,.016,.044);
      }
      if(i>1 && i<24 && i%2===0) {
        box('gold',x,.231,side*w,.009,.11,.010);
        box('dark',x,.281,side*w,.067,.015,.021);
      }
    }
  }
  // Raised stern gallery, warm windows, a sheltered helm and capstan.
  box('hull',-.657,.23,0,.33,.17,.34,0,0,0,new THREE.Color(0x593c2b));
  box('deck',-.66,.325,0,.36,.031,.365);
  box('gold',-.84,.265,0,.018,.028,.354);
  for(let z=-.126;z<=.13;z+=.084) {
    box('window',-.849,.239,z,.011,.071,.057);
    box('gold',-.858,.239,z-.034,.015,.079,.009);
    box('gold',-.858,.239,z+.034,.015,.079,.009);
  }
  for(const side of [-1,1]) {
    for(let x=-.77;x<-.51;x+=.084) box('window',x,.239,side*.174,.054,.061,.010);
    box('gold',-.657,.291,side*.178,.341,.01,.012);
    box('dark',-.674,.367,side*.175,.34,.017,.018);
    for(let x=-.815;x<=-.50;x+=.063) box('gold',x,.348,side*.177,.009,.039,.009);
  }
  for(let j=0;j<4;j++) box('deck',-.442+j*.033,.299-j*.031,0,.037,.025,.12);
  box('dark',-.61,.368,0,.04,.06,.04);
  for(let k=0;k<8;k++) {
    const a=k*Math.PI/4;
    line([-.599,.422,0],[-.599,.422+Math.sin(a)*.047,Math.cos(a)*.047]);
    line([-.599,.422+Math.sin(a)*.044,Math.cos(a)*.044],[-.599,.422+Math.sin(a+.7854)*.044,Math.cos(a+.7854)*.044]);
  }
  box('dark',.215,.196,0,.095,.05,.095);
  spar('gold',[.173,.224,0],[.254,.224,0],.012);
  spar('gold',[.214,.224,-.06],[.214,.224,.06],.012);
  for(const x of [-.34,.02,.34]) {
    box('dark',x,.178,0,.12,.026,.11);
    for(let k=-1;k<=1;k++) box('deck',x+k*.032,.196,0,.010,.015,.095);
  }
  // Foredeck, carved beak, bowsprit and dolphin striker remain inside the 2 m envelope.
  box('deck',.618,.21,0,.20,.046,.22);
  spar('dark',[.58,.20,0],[.995,.43,0],.028);
  spar('gold',[.73,.279,0],[.995,.43,0],.009);
  spar('dark',[.78,.298,0],[.825,.103,0],.016);
  line([.64,.11,-.095],[.99,.43,0]);
  line([.64,.11,.095],[.99,.43,0]);
  line([.57,-.02,0],[.825,.103,0]);
  line([.825,.103,0],[.99,.43,0]);
  box('gold',.752,.158,0,.07,.036,.06,0,0,-.32);

  function sail(x,top,height,width,redPattern=false) {
    const cols=10, rows=5;
    function point(u,v) {
      const taper=1-.09*v;
      return [x+.068*Math.sin(Math.PI*u)*Math.sin(Math.PI*v), top-height*v-.018*Math.sin(Math.PI*u), (u-.5)*width*taper];
    }
    function tri(a,b,c,col) {
      sailPosition.push(...a,...b,...c);
      for(let n=0;n<3;n++) sailColor.push(col.r,col.g,col.b);
    }
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) {
      const u=i/cols,v=j/rows,a=point(u,v),b=point(u+1/cols,v),c=point(u+1/cols,v+1/rows),d=point(u,v+1/rows);
      const crimson=redPattern && (i===3 || i===4 || i===7);
      color.set(crimson?0xae4030:(i+j)%3===0?0xe9d7ae:0xf4e6c8);
      tri(a,b,c,color);tri(a,c,d,color);
    }
    spar('dark',[x,top+.009,-width*.54],[x,top+.009,width*.54],.017);
    spar('deck',[x,top-height,-width*.455],[x,top-height,width*.455],.010);
    for(const side of [-1,1]) {
      const hem=[];
      for(let j=0;j<=rows;j++) hem.push(point(side<0?0:1,j/rows));
      curve(hem);
      line([x,top-height,side*width*.455],[x-.05,.239,side*.217]);
      line([x,top+.01,side*width*.54],[x,Math.min(top+.16,1.62),0]);
    }
    for(let c=2;c<cols;c+=2) {
      const seam=[];
      for(let j=0;j<=rows;j++) {
        const p=point(c/cols,j/rows);p[0]+=.0007;seam.push(p);
      }
      curve(seam);
    }
  }
  const masts=[
    {x:.445,top:1.447,sails:[[1.364,.197,.31],[1.135,.229,.405],[.868,.267,.47]]},
    {x:-.058,top:1.623,sails:[[1.548,.218,.335],[1.283,.252,.423],[.984,.325,.50]]},
    {x:-.557,top:1.301,sails:[[1.227,.203,.295],[.984,.261,.388]]}
  ];
  for(let mi=0;mi<masts.length;mi++) {
    const m=masts[mi];
    spar('dark',[m.x,.16,0],[m.x,m.top,0],mi===1?.026:.023);
    spar('deck',[m.x,m.top-.45,0],[m.x,m.top,0],.015);
    const crow=m.top-.45;
    box('dark',m.x,crow,0,.092,.025,.092);
    box('gold',m.x,crow+.023,0,.100,.011,.100);
    for(let k=0;k<m.sails.length;k++){const [top,height,width]=m.sails[k];sail(m.x,top,height,width*1.35,mi===1&&k>=1);}
    // Four shrouds per side and their ratlines form full triangular rope ladders.
    for(const side of [-1,1]) {
      for(let k=0;k<4;k++) line([m.x-.15+k*.095,.224,side*.205],[m.x,crow+.018,side*.018]);
      const n=12;
      for(let k=1;k<n;k++) {
        const t=k/n,y=.224+(crow-.206)*t;
        line([m.x-.15*(1-t),y,side*(.205*(1-t)+.018*t)],[m.x+.135*(1-t),y,side*(.205*(1-t)+.018*t)]);
      }
      line([m.x,m.top-.024,0],[m.x-.19,.247,side*.22]);
    }
  }
  line([.995,.43,0],[.445,1.441,0]);
  line([.90,.385,0],[.445,1.162,0]);
  line([.445,1.441,0],[-.058,1.613,0]);
  line([-.058,1.613,0],[-.557,1.291,0]);
  line([-.557,1.291,0],[-.844,.328,0]);
  line([.445,1.139,0],[-.058,1.615,0]);
  line([-.058,1.284,0],[-.557,1.291,0]);
  // The small flying jib and split pennants preserve the square-rig silhouette.
  function fabricTriangle(a,b,c,hex) {
    sailPosition.push(...a,...b,...c);color.set(hex);
    for(let k=0;k<3;k++) sailColor.push(color.r,color.g,color.b);
  }
  fabricTriangle([.932,.454,.005],[.461,1.248,.005],[.494,.667,.011],0xf0dfb9);
  fabricTriangle([-.075,1.624,0],[-.30,1.599,.016],[-.075,1.569,0],0xb64430);
  fabricTriangle([.435,1.446,0],[.252,1.43,.016],[.435,1.395,0],0xc9a259);
  spar('gold',[-.058,1.56,0],[-.058,1.64,0],.01);

  for(const [key,entries] of Object.entries(batches)) {
    if(!entries.length) continue;
    const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),palette[key],entries.length);
    mesh.name='Ship / '+key;
    for(let i=0;i<entries.length;i++) {
      mesh.setMatrixAt(i,entries[i].matrix);
      if(key==='hull') mesh.setColorAt(i,entries[i].tint || color.set(0x61412b));
    }
    mesh.castShadow=true;mesh.receiveShadow=true;
    mesh.instanceMatrix.needsUpdate=true;
    if(mesh.instanceColor) mesh.instanceColor.needsUpdate=true;
    mesh.computeBoundingSphere();group.add(mesh);
  }
  const sailGeometry=new THREE.BufferGeometry();
  sailGeometry.setAttribute('position',new THREE.Float32BufferAttribute(sailPosition,3));
  sailGeometry.setAttribute('color',new THREE.Float32BufferAttribute(sailColor,3));
  sailGeometry.computeVertexNormals();
  const sailMesh=new THREE.Mesh(sailGeometry,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:.96,flatShading:true,emissive:0x62513b,emissiveIntensity:.14}));
  sailMesh.name='Eight square sails, striped mainsail, jib and pennants';
  sailMesh.castShadow=true;sailMesh.receiveShadow=true;group.add(sailMesh);
  const lineGeometry=new THREE.BufferGeometry();
  lineGeometry.setAttribute('position',new THREE.Float32BufferAttribute(rope,3));
  const rigging=new THREE.LineSegments(lineGeometry,new THREE.LineBasicMaterial({color:0x453322,transparent:true,opacity:.78}));
  rigging.name='Standing rigging, running rigging and ratlines';group.add(rigging);
  group.userData.waterline=0;
  group.userData.forward=new THREE.Vector3(1,0,0);
  return {group,sails:[sailMesh],lamps:[palette.window]};
}

function createIsland(THREE) {
  const group = new THREE.Group();

const cWarm=new THREE.Color('#ffe0ad'),cCool=new THREE.Color('#728eaa'),cStorm=new THREE.Color('#59616d');
const skyColors=['#253c72','#d89b89','#85c6d4','#d98a53','#253c72'].map(c=>new THREE.Color(c));
const roomColors=['#415d79','#a78e83','#9fafa4','#a8784e','#415d79'].map(c=>new THREE.Color(c));
function update(t){
 const dt=Math.min((t-last)/1000,.05);last=t;const running=speed!==0;const ds=dt*speed;sim+=ds;time.value=sim;day=(day+ds/240)%1;
 const daySun=Math.sin((day-.25)*TAU);night.value=1-THREE.MathUtils.smoothstep(daySun,-.25,.4);
 storm.value=THREE.MathUtils.damp(storm.value,stormPressed||holdButton||stormLatched?1:0,2.3,dt);
 bottle.rotation.z=Math.sin(sim*2.8)*.026*storm.value;bottle.rotation.x=Math.sin(sim*2.1)*.035*storm.value;
 bottle.updateMatrixWorld(true);inverseBottle.value.copy(bottle.matrixWorld).invert();
 hemisphere.intensity=mix(2.25,.85,night.value)*(1-storm.value*.37);hemisphere.color.copy(cWarm).lerp(cCool,night.value).lerp(cStorm,storm.value*.45);
 sunLight.intensity=mix(4.3,.5,night.value)*(1-storm.value*.70);sunLight.color.set(night.value>.7?'#9bbad8':'#ffd0a0');rimLight.intensity=mix(2.5,1.8,night.value);
 renderer.toneMappingExposure=mix(1.12,1.0,night.value);
 const skyIndex=Math.floor(day*4),skyBlend=THREE.MathUtils.smoothstep(day*4-skyIndex,0,1);skyTint.value.copy(skyColors[skyIndex]).lerp(skyColors[skyIndex+1],skyBlend);windowLight.color.copy(roomColors[skyIndex]).lerp(roomColors[skyIndex+1],skyBlend);
 cloudMaterial.color.set('#ffffff').lerp(new THREE.Color('#404856'),storm.value*.95).lerp(new THREE.Color('#748d9e'),night.value*.4);
 island.beacon.rotation.y=sim*.48;island.lamps.forEach(m=>m.emissiveIntensity=.4+night.value*2.5);
 if(vessel.lamps)vessel.lamps.forEach(m=>m.emissiveIntensity=.8+night.value*2.3);
 treasureLight.intensity=1.1+night.value*1.3;goldMat.emissiveIntensity=.7+night.value*.8;
 starsMat.opacity=night.value*(1-storm.value)*.9;
 const celestialAngle=(day-.25)*TAU;
 sunDisc.position.set(Math.cos(celestialAngle)*2.7,Math.sin(celestialAngle)*1.4+.05,-.72);sunDisc.visible=daySun>-.13;
 moonDisc.position.set(-Math.cos(celestialAngle)*2.7,-Math.sin(celestialAngle)*1.4+.05,-.72);moonDisc.visible=daySun<.12;
 clouds.position.x=Math.sin(sim*.035)*.12;
 // Four displaced water samples determine heave, pitch and roll in the vessel's local axes.
 orbitAngle+=ds*.038;const sx=-.70+Math.cos(orbitAngle)*2.35,sz=-.14+Math.sin(orbitAngle)*1.23;
 const heading=Math.atan2(1.23*Math.cos(orbitAngle),-2.35*Math.sin(orbitAngle));const fx=Math.cos(heading),fz=Math.sin(heading),rx=-fz,rz=fx;
 const front=waveHeight(sx+fx*.63,sz+fz*.63),back=waveHeight(sx-fx*.63,sz-fz*.63),port=waveHeight(sx-rx*.22,sz-rz*.22),starboard=waveHeight(sx+rx*.22,sz+rz*.22);
 vessel.group.position.set(sx,-.41+(front+back+port+starboard)/4,sz);
 const orientation=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,-heading,0));const tilt=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.atan2(port-starboard,.44)*.65,0,Math.atan2(front-back,1.26)*.8));orientation.multiply(tilt);vessel.group.quaternion.slerp(orientation,1-Math.exp(-dt*5));
 for(let i=0;i<72;i++){const age=i/72,theta=orbitAngle-age*.34,wx=-.7+Math.cos(theta)*2.35,wz=-.14+Math.sin(theta)*1.23;const side=i%2?1:-1;dummy.position.set(wx-rx*(.12+age*.23)*side,-.405+waveHeight(wx,wz),wz-rz*(.12+age*.23)*side);dummy.rotation.set(0,-heading,0);dummy.scale.set(.045+age*.06,.009,.023+age*.014);dummy.updateMatrix();wake.setMatrixAt(i,dummy.matrix);}wake.instanceMatrix.needsUpdate=true;
 buoys.forEach(b=>{b.g.position.set(b.x,-.43+waveHeight(b.x,b.z),b.z);b.g.rotation.z=Math.sin(sim*1.9+b.x)*(.06+storm.value*.15);});
 for(let i=0;i<48;i++){const a=sim*.20+i*.47,school=i<24?0:1;dummy.position.set(-1.4+Math.cos(a)*(1.8+school*.6),-1.13+Math.sin(a*1.5)*.22-school*.43,Math.sin(a)*(.75+school*.5));dummy.rotation.set(0,-a,Math.PI/2);dummy.scale.setScalar(.70+(i%5)*.12);dummy.updateMatrix();fish.setMatrixAt(i,dummy.matrix);}fish.instanceMatrix.needsUpdate=true;
 bubbleSeeds.forEach((b,i)=>{const h=((sim*.075+b.t)%1);dummy.position.set(b.x+Math.sin(sim+b.t*24)*.045,-2.05+h*1.7,b.z);dummy.rotation.set(sim*.1,0,0);dummy.scale.setScalar(b.s*(.5+h*.7));dummy.updateMatrix();bubbles.setMatrixAt(i,dummy.matrix);});bubbles.instanceMatrix.needsUpdate=true;
 gulls.forEach((b,i)=>{const a=sim*.22+i*TAU/6; b.g.position.set(-.8+Math.cos(a)*(1.65+i*.055),1.28+Math.sin(a*2+i)*.06,Math.sin(a)*.70);b.g.rotation.y=-a-Math.PI/2;b.g.rotation.x=Math.sin(a)*.15;b.wings.forEach(w=>w.rotation.x=Math.sin(sim*5+i)*.27*w.userData.side);});
 const leap=(sim+7)%25,leaping=leap<4.2,arc=Math.sin(leap/4.2*Math.PI);whale.position.set(-2.55+leap*.24,-1.10+(leaping?arc*1.08:0),-.96);whale.rotation.z=leaping?Math.cos(leap/4.2*Math.PI)*.75:0;whale.visible=leaping||leap<7;
 spraySeeds.forEach((p,i)=>{let px,py,pz,s;if(i<100){const age=(sim*1.6+p.t)%1;const side=i%2?1:-1;px=sx+fx*.94+rx*side*age*.35-fx*age*.25;pz=sz+fz*.94+rz*side*age*.35-fz*age*.25;py=-.38+waveHeight(px,pz)+Math.sin(age*Math.PI)*(.09+storm.value*.37);s=(1-age)*(.013+storm.value*.02);}else if(i<210){const age=(sim*1.25+p.t)%1;px=p.x+Math.sin(p.a)*age*.12;pz=p.z+Math.cos(p.a)*age*.12;py=-.4+waveHeight(px,pz)+Math.sin(age*Math.PI)*.55*storm.value;s=storm.value*(1-age)*.024;}else{const age=(sim*.95+p.t)%1;px=whale.position.x+Math.cos(p.a)*age*.7;pz=whale.position.z+Math.sin(p.a)*age*.6;py=-.4+Math.sin(age*Math.PI)*.65;s=leaping?(.025*(1-age)):0;}dummy.position.set(px,py,pz);dummy.rotation.set(0,sim+p.a,0);dummy.scale.setScalar(s);dummy.updateMatrix();droplets.setMatrixAt(i,dummy.matrix);});droplets.instanceMatrix.needsUpdate=true;
 if(running){lightning=Math.max(0,lightning-dt*6);if(storm.value>.5&&Math.sin(sim*1.31)>.987)lightning=1;}
 flash.intensity=lightning*18*storm.value;boltMaterial.opacity=lightning*storm.value;bolt.visible=boltMaterial.opacity>.01;
 if(!dragging&&t-lastInput>10000&&running)desiredYaw+=dt*.035;
 yaw=THREE.MathUtils.damp(yaw,desiredYaw,8,dt);pitch=THREE.MathUtils.damp(pitch,desiredPitch,8,dt);distance=THREE.MathUtils.damp(distance,desiredDistance,7,dt);
 camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*distance,target.y+Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(target);
 renderer.render(scene,camera);frames++;if(t-fpsTime>1000){fps=Math.round(frames*1000/(t-fpsTime));frames=0;fpsTime=t;$('fps').textContent=String(fps);const hour=Math.floor(day*24),minutes=Math.floor((day*24-hour)*60);$('clock').textContent=String(hour).padStart(2,'0')+':'+String(minutes).padStart(2,'0');const phase=phaseIndex();$('phase-name').textContent=phases[phase];$('weather').textContent=storm.value>.3?'暴风雨':'风平浪静';$('storm').setAttribute('aria-pressed',String(stormPressed||holdButton||stormLatched));$('stage').dataset.telemetry=JSON.stringify({fps,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,instances:waterTiles.length,storm:Number(storm.value.toFixed(3)),speed,phase:phases[phase],sim:Number(sim.toFixed(2)),boundaryMaterials:boundedMaterials.size});}
 requestAnimationFrame(update);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.far=Math.max(200,fitDistance()*5);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);desiredDistance=fitDistance();distance=desiredDistance;roomBackdrop.scale.setScalar(Math.max(6,fitDistance()*.30));}
window.addEventListener('resize',resize);resize();
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();$('error').hidden=false;$('error-message').textContent='图形上下文已中断，请重新加载恢复场景。';});
$('loading').classList.add('done');setTimeout(()=>$('loading').hidden=true,700);requestAnimationFrame(update);

})().catch(error=>{document.getElementById('loading').hidden=true;document.getElementById('error').hidden=false;document.getElementById('error-message').textContent='无法装入场景。请确认网络可访问 CDN，且 Chrome 已启用图形加速。'+(error.message?'（'+error.message+'）':'');console.error(error);});
